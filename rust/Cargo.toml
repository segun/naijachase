[workspace]
resolver = "2"
members = ["crates/naijachase-contracts", "crates/naijachase-core", "crates/naijachase-content", "crates/naijachase-storage", "crates/naijachase-api", "crates/naijachase-cli", "crates/naijachase-terminal", "crates/naijachase-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"
mysql = { version = "26", features = ["rustls-tls-ring"] }
sha2 = "0.10"
dotenvy = "0.15"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
subtle = "2"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
naijachase-contracts = { path = "crates/naijachase-contracts" }
naijachase-core = { path = "crates/naijachase-core" }
naijachase-content = { path = "crates/naijachase-content" }
naijachase-storage = { path = "crates/naijachase-storage" }
