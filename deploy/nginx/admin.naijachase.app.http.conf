# First-install HTTP-only ACME bootstrap. No certificate is required yet.
# Admin app/API remain unavailable until the final HTTPS site is installed.
server {
    listen 80;
    listen [::]:80;
    server_name admin.naijachase.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
