# Install after certificate issuance. For Certbot blocks in default, use
# make admin-nginx-move-from-default; it keeps the existing certificate.
# See docs/admin-deployment.md. The player/landing installer does not touch it.
# This file is included from Nginx's http block. Exclude query strings (account
# searches can contain email), cookies and authorization values from access logs.
log_format naijachase_admin_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name admin.naijachase.app;
    access_log /var/log/nginx/naijachase-admin.access.log naijachase_admin_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://admin.naijachase.app$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.naijachase.app;
    access_log /var/log/nginx/naijachase-admin.access.log naijachase_admin_safe;
    root /var/www/naijachase-admin;
    index index.html;
    client_max_body_size 16k;

    ssl_certificate /etc/letsencrypt/live/admin.naijachase.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.naijachase.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The login page is public over HTTPS; the admin API enforces staff
    # authentication and permissions. Optional network restrictions go here.

    # Apply no-store to every location, including HTML and PII-bearing JSON.
    # Do not add location-level add_header directives without repeating these.
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Health probes are loopback operations, not public admin proxy routes.
    location = /health/live { return 404; }
    location = /health/ready { return 404; }
    location = /admin-api/health/live { return 404; }
    location = /admin-api/health/ready { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~ \.map$ { return 404; }

    location /admin-api/ {
        # Preserve /admin-api: it is part of the backend's route contract.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
