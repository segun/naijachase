server {
    listen 80;
    listen [::]:80;
    server_name naijachase.app www.naijachase.app;
    return 301 https://naijachase.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.naijachase.app;

    ssl_certificate /etc/letsencrypt/live/naijachase.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijachase.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://naijachase.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name naijachase.app;

    root /var/www/naijachase.app;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/naijachase.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijachase.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Request-ID $request_id always;

    # Prometheus scrapes the API directly on loopback. Never expose metrics via
    # the public /api reverse proxy.
    location ~ (^|/)\.DS_Store$ { return 404; }

    location = /api/metrics { return 404; }

    location = /ads-api/v1/events {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
    }

    location ^~ /ads-api/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $request_id always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Production source maps are retained outside the document root.
    location ~ \.map$ { return 404; }

    # GLBs use a catalogue content hash in the query string. Only requests with
    # the exact generated version shape are immutable; direct/unversioned model
    # and texture requests must revalidate.
    location /assets/3d/ {
        set $model_cache_control "public, max-age=0, must-revalidate";
        if ($arg_v ~ "^[a-f0-9]{20}$") {
            set $model_cache_control "public, max-age=31536000, immutable";
        }
        try_files $uri =404;
        add_header Cache-Control $model_cache_control;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    # Vite-generated filenames carry a content hash. Public, unversioned assets
    # use the revalidating prefix below rather than a year-long immutable cache.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|svg|png|webp|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
