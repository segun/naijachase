server {
    listen 80;
    listen [::]:80;
    server_name naijachase.app www.naijachase.app;
    return 301 https://naijachase.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.naijachase.app;

    ssl_certificate /etc/letsencrypt/live/naijachase.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijachase.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://naijachase.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name naijachase.app;

    root /var/www/naijachase.app;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/naijachase.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijachase.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
