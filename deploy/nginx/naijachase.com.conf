server {
    listen 80;
    listen [::]:80;
    server_name naijachase.com www.naijachase.com;
    return 301 https://naijachase.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.naijachase.com;

    ssl_certificate /etc/letsencrypt/live/naijachase.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijachase.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://naijachase.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name naijachase.com;

    root /var/www/naijachase.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/naijachase.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naijachase.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Clean URLs: /privacy -> /privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
}
